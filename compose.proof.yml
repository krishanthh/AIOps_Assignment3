name: a3-proof
x-common: &common
  image: da3408-node:latest
  volumes:
    - .:/workspace
  working_dir: /workspace
  environment: &environment
    PYTHONDONTWRITEBYTECODE: '1'
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
    SPARK_DAEMON_MEMORY: 128m
    SHUFFLE_PARTITIONS: '8'
    PYTHONPATH: /workspace
    RAY_USAGE_STATS_ENABLED: '0'
    RAY_DATA_ENABLE_PROGRESS_BARS: '0'
    RAY_DATA_DEFAULT_SHUFFLE_STRATEGY: hash_shuffle_v2
services:
  spark-master:
    <<: *common
    profiles: [spark]
    hostname: spark-master
    container_name: a3-proof-spark-master
    mem_limit: 896m
    memswap_limit: 896m
    cpus: 1
    ports: ['127.0.0.1:8080:8080', '127.0.0.1:4040:4040']
    command: ['/usr/local/lib/python3.14/site-packages/pyspark/bin/spark-class', 'org.apache.spark.deploy.master.Master', '--host', 'spark-master', '--port', '7077', '--webui-port', '8080']
  spark-worker-1:
    <<: *common
    profiles: [spark]
    container_name: a3-proof-spark-worker-1
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    ports: ['127.0.0.1:8081:8081']
    depends_on: [spark-master]
    command: ['/usr/local/lib/python3.14/site-packages/pyspark/bin/spark-class', 'org.apache.spark.deploy.worker.Worker', 'spark://spark-master:7077', '--cores', '1', '--memory', '512M', '--webui-port', '8081']
  spark-worker-2:
    <<: *common
    profiles: [spark]
    container_name: a3-proof-spark-worker-2
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    ports: ['127.0.0.1:8082:8081']
    depends_on: [spark-master]
    command: ['/usr/local/lib/python3.14/site-packages/pyspark/bin/spark-class', 'org.apache.spark.deploy.worker.Worker', 'spark://spark-master:7077', '--cores', '1', '--memory', '512M', '--webui-port', '8081']
  ray-head:
    <<: *common
    profiles: [ray]
    container_name: a3-proof-ray-head
    hostname: ray-head
    mem_limit: 1536m
    memswap_limit: 2g
    cpus: 1
    shm_size: 128m
    ports: ['127.0.0.1:8265:8265']
    command: ['ray', 'start', '--head', '--port=6379', '--dashboard-host=0.0.0.0', '--num-cpus=0', '--object-store-memory=83886080', '--memory=134217728', '--block']
  ray-worker-1:
    <<: *common
    profiles: [ray]
    container_name: a3-proof-ray-worker-1
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    shm_size: 128m
    depends_on: [ray-head]
    command: ['ray', 'start', '--address=ray-head:6379', '--num-cpus=1', '--object-store-memory=100663296', '--memory=268435456', '--block']
  ray-worker-2:
    <<: *common
    profiles: [ray]
    container_name: a3-proof-ray-worker-2
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    shm_size: 128m
    depends_on: [ray-head]
    command: ['ray', 'start', '--address=ray-head:6379', '--num-cpus=1', '--object-store-memory=100663296', '--memory=268435456', '--block']
